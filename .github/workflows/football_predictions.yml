name: Football Prediction Engine

on:
  workflow_dispatch:

  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"

jobs:

  football-predictions:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hybrid prediction engine
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_API_KEY_2: ${{ secrets.FOOTBALL_API_KEY_2 }}
        run: |
          python hybrid_engine.py

      - name: Upload prediction results
        uses: actions/upload-artifact@v4
        with:
          name: football-predictions
          path: data/output/
