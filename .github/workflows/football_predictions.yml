name: Football Prediction Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: football-prediction-engine
  cancel-in-progress: false

jobs:
  football-predictions:
    name: Run Hybrid Prediction Engine
    runs-on: ubuntu-latest
    environment: Api keys
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify project files
        shell: bash
        run: |
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"
          pwd
          echo ""
          echo "Repository contents:"
          ls -la
          echo ""
          echo "Checking required files..."

          if [ ! -f "hybrid_engine.py" ]; then
            echo "ERROR: hybrid_engine.py was not found."
            exit 1
          fi

          if [ ! -f "requirements.txt" ]; then
            echo "ERROR: requirements.txt was not found."
            exit 1
          fi

          echo ""
          echo "Required files found successfully."

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        shell: bash
        run: |
          python -m py_compile hybrid_engine.py
          echo "Python syntax check passed."

      - name: Prepare output directory
        shell: bash
        run: |
          mkdir -p data/output
          echo "Output directory ready."

      - name: Run hybrid prediction engine
        shell: bash
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_API_KEY_2: ${{ secrets.FOOTBALL_API_KEY_2 }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "========================================"
          echo "STARTING HYBRID FOOTBALL ENGINE"
          echo "========================================"

          if [ -z "$FOOTBALL_API_KEY" ]; then
            echo "ERROR: FOOTBALL_API_KEY secret is missing."
            exit 1
          fi

          if [ -z "$FOOTBALL_API_KEY_2" ]; then
            echo "WARNING: FOOTBALL_API_KEY_2 is not configured."
            echo "The engine will continue using the first API key."
          fi

          python hybrid_engine.py

      - name: Inspect prediction output
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "OUTPUT FILES"
          echo "========================================"

          if [ -d "data/output" ]; then
            find data/output -maxdepth 2 -type f -print
          else
            echo "data/output directory does not exist."
          fi

      - name: Upload prediction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-predictions-${{ github.run_number }}
          path: |
            data/output/**
            *.json
            *.log
          if-no-files-found: warn
          retention-days: 14
